services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/service-account.json
      SQLITE_PATH: /app/data/bot.sqlite3
    volumes:
      - ./secrets/service-account.json:/run/secrets/service-account.json:ro
      - bot-data:/app/data
    stop_grace_period: 4m

volumes:
  bot-data:
